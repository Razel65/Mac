<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="projectquiz.css">
</head>
<body>
  <div id="login-container">
    <form id="login-form">
        <label for="username">Gebruikersnaam:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="password">Wachtwoord:</label>
        <input type="password" id="password" name="password" required><br><br>
        <div id="error-message" style="color: red; display: none;"></div> 
        <button type="button" id="login-button">Inloggen</button>
        <button type="button" id="register-popup-button">Registreren</button>
    </form>
  </div>
  
  <script src="loginquizz.js"></script>

  <script>
    document.getElementById("login-button").addEventListener("click", async () => {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

          const response = await fetch('login_backend.php', {
        method: 'POST',
        body: JSON.stringify({ username, password, action: 'login' }),
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await response.json();

      if (data.success) {
        window.location.href = 'projectquiz.php';  
           } else {
        document.getElementById("error-message").innerText = 'Onjuiste gebruikersnaam of wachtwoord';
        document.getElementById("error-message").style.display = 'block';
      }
    });
  </script>
</body>
</html>
